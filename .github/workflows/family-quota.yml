name: Family quota checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: family_ci_password
          MYSQL_DATABASE: family_quota_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: family_ci_password
          POSTGRES_DB: family_quota_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MYSQL_DSN: root:family_ci_password@tcp(127.0.0.1:3306)/family_quota_test?parseTime=true&charset=utf8mb4
      TEST_POSTGRES_DSN: postgres://postgres:family_ci_password@127.0.0.1:5432/family_quota_test?sslmode=disable
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Test family accounting and relay
        run: go test -v ./model ./service ./controller ./router -run '^Test(FamilyQuota|AccessTokenRouteRulesCoverEveryDashboardRoute)' -count=1
